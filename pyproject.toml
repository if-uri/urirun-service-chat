[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urirun-service-chat"
version = "0.1.0"
description = "Standalone urirun chat/operator dashboard service on port 8194"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "if-uri" }]
dependencies = ["urirun[host]>=0.4.88"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://connect.ifuri.com/services/chat"
Repository = "https://github.com/if-uri/urirun-service-chat"

[project.scripts]
urirun-service-chat = "urirun_service_chat.core:main"
urirun-chat = "urirun_service_chat.core:main"

[project.entry-points."urirun.services"]
chat = "urirun_service_chat.core:urirun_service"

[tool.setuptools.packages.find]
where = ["."]
include = ["urirun_service_chat*"]

[tool.setuptools.package-data]
urirun_service_chat = ["service.manifest.json"]
